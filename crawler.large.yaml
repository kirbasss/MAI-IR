db:
  uri: mongodb://127.0.0.1:27017
  name: mai_ir

logic:
  # The entire sitemap inventory is seeded into MongoDB at startup.
  # max_documents limits requests in this run, not the number of queued URLs.
  inventory: data/discovery/inventory_all/url_inventory.tsv
  delay_seconds: 3
  revisit_seconds: 2592000
  retry_seconds: 21600
  lease_seconds: 600
  request_timeout_seconds: 30
  seed_batch_size: 500
  max_documents: 30000
  run_forever: false
  poll_seconds: 60
